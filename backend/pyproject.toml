[project]
name = "workflow-backend"
version = "0.1.0"
description = "Workflow System API: workspaces, boards, clients, automations, migration"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "charset-normalizer>=3.4",
  "python-dateutil>=2.9",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
  "types-python-dateutil>=2.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "T20", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity heuristics: judged in review instead
  "S101",     # assert is used for internal invariants
  "RUF012",   # ClassVar annotations on pydantic/sqlalchemy class attrs
  "PLC0415",  # local imports used deliberately to break cycles
  "B008",     # FastAPI Depends() in defaults
  "N818",     # domain exception names read better without an Error suffix
  "PLW0603",  # module-level singletons (engines, clock override) are deliberate
  "PLR0917",  # keyword-heavy internal helpers
  "PLW2901",  # normalising a loop variable in place is clearer here
  "PLR1714",  # comparisons against [] / {} cannot use a set
  "UP047",    # keep TypeVar style compatible with mypy plugins
  "E501",     # the formatter owns line length; long literals are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "DTZ", "N"]
"app/cli.py" = ["T201"]  # a CLI prints

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]
warn_unused_ignores = false
# SQLAlchemy expressions are frequently typed as Any; returning them is fine.
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["dateutil.*", "charset_normalizer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]
